[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[project]
name = "pitt"
version = "0.8.0"
description = "an extremely simple terminal-based password manager"
readme = "README.md"
description-content-type = "text/markdown"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "quandelaa", email = "sergiotobamasilalahi@gmail.com" }
]
keywords = ["password-manager", "terminal", "cli", "security", "encryption"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
]

dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=49.0.0",
    "platformdirs>=4.10.1",
    "pyperclip>=1.11.0",
    "rich>=15.0.0",
]

[project.scripts]
pitt = "pitt.main:main"

[project.urls]
Repository = "https://github.com/quandelaa/pitt"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
