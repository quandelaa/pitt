[project]
name = "pitt"
version = "0.0.8"
description = "an extremely simple terminal-based password manager (work in progress)"
readme = "README.md"
authors = [
    { name = "quandelaa", email = "sergiotobamasilalahi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=49.0.0",
    "rich>=15.0.0",
]

[project.scripts]
pitt = "pitt.main:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = []
